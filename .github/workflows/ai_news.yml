name: Daily AI News

on:
  schedule:
    - cron: "10 7 * * *"   # 7:10 UTC = 8:10 AM BST (UTC+1)
  workflow_dispatch:

jobs:
  send-ai-news:
    uses: ./.github/workflows/_run-digest.yml
    secrets:
      telegram_bot_token: ${{ secrets.ALWAYSNEWS_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
    with:
      digest_name: "Daily AI News"
      script_path: "ai_news.py"
