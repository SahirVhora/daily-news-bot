name: Daily News Digests

on:
  schedule:
    - cron: '0 0 * * *'   # GitHub Triage
    - cron: '15 6 * * *'  # UK News
    - cron: '25 6 * * *'  # India News
    - cron: '35 6 * * *'  # SAP News
    - cron: '45 6 * * *'  # GitHub Trending + X Trends
    - cron: '0 7 * * *'   # Top News
    - cron: '10 7 * * *'  # AI News
    - cron: '0 8 * * 0'   # Weekly Repo Health
  workflow_dispatch:
    inputs:
      digest:
        description: 'Which digest to run'
        required: true
        type: choice
        options:
          - uk_news
          - india_news
          - sap_news
          - github_trending
          - x_trends
          - top_news
          - ai_news
          - github_triage_digest
          - github_health_digest

permissions:
  contents: read

jobs:
  uk_news:
    if: (github.event_name == 'schedule' && github.event.schedule == '15 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.digest == 'uk_news')
    uses: ./.github/workflows/_run-digest.yml
    with:
      digest_name: 'Daily UK News'
      digest_id: 'uk_news'
    secrets:
      telegram_bot_token: ${{ secrets.ACCIO_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

  india_news:
    if: (github.event_name == 'schedule' && github.event.schedule == '25 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.digest == 'india_news')
    uses: ./.github/workflows/_run-digest.yml
    with:
      digest_name: 'Daily India News'
      digest_id: 'india_news'
    secrets:
      telegram_bot_token: ${{ secrets.ACCIO_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

  sap_news:
    if: (github.event_name == 'schedule' && github.event.schedule == '35 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.digest == 'sap_news')
    uses: ./.github/workflows/_run-digest.yml
    with:
      digest_name: 'Daily SAP News'
      digest_id: 'sap_news'
    secrets:
      telegram_bot_token: ${{ secrets.ALWAYSNEWS_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

  github_trending:
    if: (github.event_name == 'schedule' && github.event.schedule == '45 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.digest == 'github_trending')
    uses: ./.github/workflows/_run-digest.yml
    with:
      digest_name: 'Daily GitHub Trending'
      digest_id: 'github_trending'
    secrets:
      telegram_bot_token: ${{ secrets.ALWAYSNEWS_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

  x_trends:
    if: (github.event_name == 'schedule' && github.event.schedule == '45 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.digest == 'x_trends')
    uses: ./.github/workflows/_run-digest.yml
    with:
      digest_name: 'Daily X/Twitter Trends'
      digest_id: 'x_trends'
    secrets:
      telegram_bot_token: ${{ secrets.ALWAYSNEWS_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

  top_news:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *') || (github.event_name == 'workflow_dispatch' && inputs.digest == 'top_news')
    uses: ./.github/workflows/_run-digest.yml
    with:
      digest_name: 'Daily Top News'
      digest_id: 'top_news'
    secrets:
      telegram_bot_token: ${{ secrets.ACCIO_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

  ai_news:
    if: (github.event_name == 'schedule' && github.event.schedule == '10 7 * * *') || (github.event_name == 'workflow_dispatch' && inputs.digest == 'ai_news')
    uses: ./.github/workflows/_run-digest.yml
    with:
      digest_name: 'Daily AI News'
      digest_id: 'ai_news'
    secrets:
      telegram_bot_token: ${{ secrets.ALWAYSNEWS_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}

  github_triage_digest:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') || (github.event_name == 'workflow_dispatch' && inputs.digest == 'github_triage_digest')
    uses: ./.github/workflows/_run-digest.yml
    with:
      digest_name: 'Overnight GitHub Triage'
      digest_id: 'github_triage_digest'
    secrets:
      telegram_bot_token: ${{ secrets.ALWAYSNEWS_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
      github_pat: ${{ secrets.GH_PAT }}

  github_health_digest:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.digest == 'github_health_digest')
    uses: ./.github/workflows/_run-digest.yml
    with:
      digest_name: 'Weekly Repo Health Digest'
      digest_id: 'github_health_digest'
    secrets:
      telegram_bot_token: ${{ secrets.ALWAYSNEWS_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
      github_pat: ${{ secrets.GH_PAT }}
