name: Run Digest Workflow

on:
  workflow_call:
    inputs:
      digest_name:
        required: true
        type: string
      digest_id:
        required: true
        type: string
    secrets:
      telegram_bot_token:
        required: true
      telegram_chat_id:
        required: true
      github_pat:
        required: false

permissions:
  contents: read

jobs:
  run-digest:
    name: ${{ inputs.digest_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run standard digest
        if: inputs.digest_id != 'github_triage_digest' && inputs.digest_id != 'github_health_digest'
        env:
          DIGEST_ID: ${{ inputs.digest_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegram_bot_token }}
          TELEGRAM_CHAT_ID: ${{ secrets.telegram_chat_id }}
        run: |
          case "$DIGEST_ID" in
            uk_news) script="uk_news.py" ;;
            india_news) script="india_news.py" ;;
            sap_news) script="sap_news.py" ;;
            github_trending) script="github_trending.py" ;;
            x_trends) script="x_trends.py" ;;
            top_news) script="top_news.py" ;;
            ai_news) script="ai_news.py" ;;
            *) echo "Unsupported digest: $DIGEST_ID"; exit 2 ;;
          esac
          python "$script"

      - name: Run GitHub digest
        if: inputs.digest_id == 'github_triage_digest' || inputs.digest_id == 'github_health_digest'
        env:
          DIGEST_ID: ${{ inputs.digest_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegram_bot_token }}
          TELEGRAM_CHAT_ID: ${{ secrets.telegram_chat_id }}
          GH_TOKEN: ${{ secrets.github_pat || github.token }}
        run: |
          case "$DIGEST_ID" in
            github_triage_digest) script="github_triage_digest.py" ;;
            github_health_digest) script="github_health_digest.py" ;;
            *) echo "Unsupported GitHub digest: $DIGEST_ID"; exit 2 ;;
          esac
          python "$script"
