name: Run Digest Workflow

on:
  workflow_call:
    inputs:
      digest_name:
        required: true
        type: string
      script_path:
        required: true
        type: string
      python_version:
        required: false
        type: string
        default: "3.11"
      install_command:
        required: false
        type: string
        default: "pip install -r requirements.txt"
    secrets:
      telegram_bot_token:
        required: true
      telegram_chat_id:
        required: true
      github_pat:
        required: false

jobs:
  run-digest:
    name: ${{ inputs.digest_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Install dependencies
        run: ${{ inputs.install_command }}

      - name: Run digest script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegram_bot_token }}
          TELEGRAM_CHAT_ID: ${{ secrets.telegram_chat_id }}
          GH_TOKEN: ${{ secrets.github_pat || github.token }}
        run: python ${{ inputs.script_path }}
