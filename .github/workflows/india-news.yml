name: Daily India News

on:
  schedule:
    - cron: "25 6 * * *"   # 6:25 UTC = 7:25 AM BST (UTC+1)
  workflow_dispatch:

jobs:
  send-india-news:
    uses: ./.github/workflows/_run-digest.yml
    secrets:
      telegram_bot_token: ${{ secrets.ACCIO_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
    with:
      digest_name: "Daily India News"
      script_path: "india_news.py"
