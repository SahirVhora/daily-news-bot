name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Compile every digest
        run: python -m compileall -q .
      - name: Validate reusable workflow trust boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          reusable = Path(".github/workflows/_run-digest.yml").read_text(encoding="utf-8")
          callers = Path(".github/workflows/digests.yml").read_text(encoding="utf-8")
          forbidden = ("install_command", "script_path", "run: $" + "{{ inputs.")
          present = [value for value in forbidden if value in reusable or value in callers]
          if present:
              raise SystemExit(f"Unsafe reusable-workflow inputs found: {present}")
          for digest_id in (
              "uk_news", "india_news", "sap_news", "github_trending", "x_trends",
              "top_news", "ai_news", "github_triage_digest", "github_health_digest",
          ):
              if digest_id not in reusable or f"digest_id: '{digest_id}'" not in callers:
                  raise SystemExit(f"Missing allowlisted digest mapping: {digest_id}")
          PY
